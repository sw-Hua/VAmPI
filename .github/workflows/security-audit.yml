name: Security Audit on Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ============================================================
      # Stage 1: Basic Checks
      # ============================================================
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify application starts
        run: |
          python app.py &
          APP_PID=$!
          sleep 3
          curl -sf http://localhost:5000/ > /dev/null || { kill $APP_PID 2>/dev/null; exit 1; }
          kill $APP_PID 2>/dev/null

      # ============================================================
      # Stage 2: Security Scanning
      # ============================================================
      - name: Install security tools
        run: pip install bandit safety

      - name: Bandit SAST Scan
        id: bandit
        run: |
          echo "Extracting changed Python files from PR..."
          git diff --name-only origin/main...HEAD -- '*.py' > changed_files.txt
          echo "Changed Python files:"
          cat changed_files.txt
          if [ -s changed_files.txt ]; then
            echo "Running Bandit SAST scan on changed files..."
            # Use JSON output for reliable issue counting (text formatter omits LOW severity issues)
            bandit -l -f json -o bandit_report.json --exit-zero $(cat changed_files.txt | tr '\n' ' ')
            # Also generate text report for PR comment readability
            bandit -l -f txt -o bandit_report.txt --exit-zero $(cat changed_files.txt | tr '\n' ' ')
          else
            echo "No Python files changed. Bandit scan skipped."
            echo "No Python files changed in this PR." > bandit_report.txt
            echo '{"results":[]}' > bandit_report.json
          fi
          echo "=== Bandit Report (text) ==="
          cat bandit_report.txt
          # Parse JSON to count actual issues (catches LOW severity that text formatter hides)
          ISSUE_COUNT=$(python3 -c "import json; d=json.load(open('bandit_report.json')); print(len(d['results']))")
          echo "Bandit found ${ISSUE_COUNT} issue(s)"
          if [ "$ISSUE_COUNT" -gt 0 ]; then
            echo "bandit_failed=true" >> $GITHUB_OUTPUT
            echo "WARNING: Bandit found security issues"
          else
            echo "bandit_failed=false" >> $GITHUB_OUTPUT
            echo "PASS: No bandit issues found"
          fi

      - name: Safety Dependency Scan
        id: safety
        run: |
          if [ -n "$SAFETY_API_KEY" ]; then
            echo "Running Safety dependency scan..."
            safety check -r requirements.txt --key $SAFETY_API_KEY > safety_report.txt 2>&1
            SAFETY_EXIT=$?
            echo "=== Safety Report ==="
            cat safety_report.txt
            if [ $SAFETY_EXIT -ne 0 ]; then
              echo "safety_failed=true" >> $GITHUB_OUTPUT
              echo "WARNING: Safety found vulnerable dependencies"
            else
              echo "safety_failed=false" >> $GITHUB_OUTPUT
              echo "PASS: No vulnerable dependencies found"
            fi
          else
            echo "SAFETY_API_KEY secret not configured. Skipping dependency vulnerability scan."
            echo "safety_failed=false" >> $GITHUB_OUTPUT
          fi
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

      # ============================================================
      # Stage 3: DeepAudit AI Security Audit
      # ============================================================
      - name: DeepAudit AI Security Audit
        id: deepaudit
        run: |
          echo "============================================"
          echo "  DeepAudit AI Security Audit"
          echo "============================================"
          pip install requests
          python deepaudit_review.py
        env:
          DEEPAUDIT_URL: ${{ secrets.DEEPAUDIT_URL }}
          DEEPAUDIT_EMAIL: ${{ secrets.DEEPAUDIT_EMAIL }}
          DEEPAUDIT_PASSWORD: ${{ secrets.DEEPAUDIT_PASSWORD }}

      # ============================================================
      # Results & PR Comment
      # ============================================================
      - name: Build PR Comment
        id: report
        run: |
          echo "## 🔒 Security Audit Report" > pr_comment.md
          echo "" >> pr_comment.md
          echo "### Bandit SAST Scan" >> pr_comment.md
          echo '```' >> pr_comment.md
          cat bandit_report.txt >> pr_comment.md
          echo '```' >> pr_comment.md
          echo "" >> pr_comment.md
          echo "### Safety Dependency Scan" >> pr_comment.md
          if [ -f safety_report.txt ]; then
            echo '```' >> pr_comment.md
            cat safety_report.txt >> pr_comment.md
            echo '```' >> pr_comment.md
          else
            echo "_SAFETY_API_KEY not configured - dependency scan skipped_" >> pr_comment.md
          fi
          echo "" >> pr_comment.md
          # Append DeepAudit report
          if [ -f deepaudit_report.md ]; then
            cat deepaudit_report.md >> pr_comment.md
          else
            echo "### 🛡️ DeepAudit AI Security Audit" >> pr_comment.md
            echo "_DeepAudit analysis did not produce a report_" >> pr_comment.md
          fi

      - name: Post Comment to PR
        if: github.event_name == 'pull_request'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr_comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # CI Gate
      # ============================================================
      - name: CI Gate
        run: |
          FAILED=false
          if [ "${{ steps.bandit.outputs.bandit_failed }}" = "true" ]; then
            echo "FAIL: Bandit found code security issues"
            FAILED=true
          else
            echo "PASS: Bandit - no issues found"
          fi
          if [ "${{ steps.safety.outputs.safety_failed }}" = "true" ]; then
            echo "FAIL: Safety found vulnerable dependencies"
            FAILED=true
          else
            echo "PASS: Safety - no vulnerable dependencies"
          fi
          if [ "${{ steps.deepaudit.outputs.deepaudit_failed }}" = "true" ]; then
            echo "FAIL: DeepAudit found HIGH/CRITICAL vulnerabilities"
            FAILED=true
          else
            echo "PASS: DeepAudit - no blocking issues"
          fi
          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "=== CI GATE: RED (Security issues detected) ==="
            exit 1
          fi
          echo ""
          echo "=== CI GATE: GREEN (All checks passed) ==="
